name: Build BitChord APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract BitChord source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BitChord source ZIP not found"
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
          test -f source/BitChord-main/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        working-directory: source/BitChord-main
        run: chmod +x gradlew

      - name: Build BitChord release
        working-directory: source/BitChord-main
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleProdRelease

      - name: Locate universal APK
        shell: bash
        run: |
          set -e

          APK=$(find source/BitChord-main/app/build/outputs/apk \
            -type f \
            -name "*universal*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Universal APK not found"
            find source/BitChord-main/app/build/outputs/apk -type f
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/bitchord-release.jks" \
            -storepass "BitChordRelease2026" \
            -keypass "BitChordRelease2026" \
            -alias bitchord \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=BitChord Modified, OU=BitChord, O=BitChord, L=India, ST=Odisha, C=IN"

      - name: Sign APK
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/bitchord-release.jks" \
            --ks-pass pass:BitChordRelease2026 \
            --key-pass pass:BitChordRelease2026 \
            --ks-key-alias bitchord \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$RUNNER_TEMP/BitChord-universal-signed.apk" \
            "$APK"

      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            "$RUNNER_TEMP/BitChord-universal-signed.apk"

      - name: Print certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --print-certs \
            "$RUNNER_TEMP/BitChord-universal-signed.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Android16-SIGNED
          path: ${{ runner.temp }}/BitChord-universal-signed.apk
          if-no-files-found: error
