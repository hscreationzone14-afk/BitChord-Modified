name: Build BitChord APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract BitChord source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BitChord ZIP not found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d ./source

          if [ ! -f "./source/BitChord-main/gradlew" ]; then
            echo "ERROR: BitChord Gradle project not found."
            find ./source -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.0.12077973

      - name: Make Gradle executable
        working-directory: ./source/BitChord-main
        run: chmod +x gradlew

      - name: Build BitChord Prod Release APK
        working-directory: ./source/BitChord-main
        run: ./gradlew --no-daemon --stacktrace :app:assembleProdRelease

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find ./source/BitChord-main/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-Modified-APK
          path: ./source/BitChord-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
